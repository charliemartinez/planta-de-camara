// PDF generado directamente (sin diálogo de impresión): A4 apaisada, con varias plantas por hoja (4 columnas, filas de altura variable) o una planta por hoja
const WANSI={'€':128,'…':133,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'™':153};
// el PDF usa codificación WinAnsi; lo que no entra se cambia por '?'
const enc=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);u[i]=WANSI[s[i]]||(c<256?c:63)}return u};
const pesc=s=>String(s).replace(/[\\()]/g,'\\$&').replace(/[\r\n]+/g,' ');
const mctx=document.createElement('canvas').getContext('2d');
const tw=(s,sz,b)=>{mctx.font=(b?'bold ':'')+sz+'px Helvetica,Arial,"Liberation Sans",sans-serif';return mctx.measureText(s).width*1.03};
// parte un texto en líneas que quepan en mw puntos de ancho
function wrapW(t,mw,sz,b){const out=[];String(t||'').split(/\n+/).forEach(par=>{let l='';
 for(let w of par.split(/\s+/)){if(!w)continue;
  while(tw(w,sz,b)>mw){let k=w.length;while(k>1&&tw(w.slice(0,k),sz,b)>mw)k--;if(l){out.push(l);l=''}out.push(w.slice(0,k));w=w.slice(k)}
  const c=l?l+' '+w:w;if(l&&tw(c,sz,b)>mw){out.push(l);l=w}else l=c}
 if(l)out.push(l)});return out}
// convierte cada plano en una imagen JPG para meterla en el PDF
function collect(scope,fmt){const k2=fmt==='single'?2:1,out=[];
 (scope==='one'?[S.cur]:S.scenes.map((_,i)=>i)).forEach(si=>{const s=S.scenes[si];
  s.planos.forEach((p,pi)=>{
   const c=document.createElement('canvas');c.width=W*k2;c.height=H*k2;const g=c.getContext('2d');g.scale(k2,k2);render(g,p.items,null);
   const b=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
   const cams=p.items.filter(x=>x.type==='cam').map(x=>x.label.replace(/^Cámara /,'')+' '+x.lens+'mm'+(x.pnl?' PNL '+x.pnl:'')+(x.alt||x.ang?' ['+apTxt(x,'/')+']':'')+(x.note?' ('+x.note+')':''));
   out.push({jpg:u,pw:W*k2,ph:H*k2,title:(si+1)+'. '+s.name+(s.planos.length>1?' - '+p.name:''),cams,notes:pi===0?s.notes:''})})});
 return out}
// reparte los planos en las páginas del PDF
function layoutPdf(P,fmt){
 const PW=842,PH=595,M=28,top=M+24,pages=[];const np=()=>{const a=[];pages.push(a);return a};
 const sumH=ls=>ls.reduce((a,l)=>a+l.lh,0);
 if(fmt==='single'){const aw=PW-2*M;
  P.forEach((p,i)=>{
   let ls=wrapW(p.title,aw,12,1).map(t=>({t,f:2,sz:12,lh:15}));
   p.cams.forEach(c=>wrapW(c,aw,9).forEach(t=>ls.push({t,f:1,sz:9,lh:12})));
   wrapW(p.notes,aw,9).forEach(t=>ls.push({t,f:1,sz:9,lh:12}));
   const room=PH-top-M-6-220,first=[];let used=0;
   while(ls.length&&used+ls[0].lh<=room){used+=ls[0].lh;first.push(ls.shift())}
   const ih=Math.min(aw*p.ph/p.pw,PH-top-M-8-used),iw=ih*p.pw/p.ph;
   np().push({i,x:M+(aw-iw)/2,y:top,iw,ih,ls:first,tx:M,ty:top+ih+first[0].sz+3});
   while(ls.length){const chunk=[];let u=0;while(ls.length&&u+ls[0].lh<=PH-top-M){u+=ls[0].lh;chunk.push(ls.shift())}
    np().push({i:-1,ls:chunk,tx:M,ty:top+chunk[0].sz})}})}
 else{const cols=4,gx=8,gy=10,cw=(PW-2*M-gx*(cols-1))/cols;let y=top,pg=null;
  for(let r0=0;r0<P.length;r0+=cols){
   const row=P.slice(r0,r0+cols).map((p,c)=>{const ls=wrapW(p.title,cw,8.5,1).map(t=>({t,f:2,sz:8.5,lh:9.5}));
    wrapW(p.cams.join(' · '),cw,7).forEach(t=>ls.push({t,f:1,sz:7,lh:8.5}));wrapW(p.notes,cw,7).forEach(t=>ls.push({t,f:1,sz:7,lh:8.5}));
    return{p,i:r0+c,c,ls,ih:cw*p.ph/p.pw}});
   const ih=row[0].ih;let th=Math.max(...row.map(o=>sumH(o.ls)));
   if(!pg||y+ih+4+th>PH-M){if(pg&&y>top){pg=np();y=top}else if(!pg){pg=np();y=top}}
   const room=PH-M-(y+ih+4);
   const rest=[]; // texto que no cabe debajo del dibujo: sigue en páginas aparte, sin cortar nada
   row.forEach(o=>{const keep=[];let u=0;while(o.ls.length&&(u+o.ls[0].lh<=room||!keep.length)){u+=o.ls[0].lh;keep.push(o.ls.shift())}
    if(o.ls.length)rest.push({title:P[o.i].title,t:o.ls.map(l=>l.t).join(' ')});o.ls=keep});
   row.forEach(o=>pg.push({i:o.i,x:M+o.c*(cw+gx),y,iw:cw,ih:o.ih,ls:o.ls,tx:M+o.c*(cw+gx),ty:y+o.ih+o.ls[0].sz+2}));
   y+=ih+4+Math.max(...row.map(o=>sumH(o.ls)))+gy;
   if(rest.length){rest.forEach(r=>{const ls=[{t:r.title+' (continuación del texto)',f:2,sz:10,lh:13}].concat(wrapW(r.t,PW-2*M,9).map(t=>({t,f:1,sz:9,lh:11.5})));
     while(ls.length){const chunk=[];let u=0;while(ls.length&&(u+ls[0].lh<=PH-top-M||!chunk.length)){u+=ls[0].lh;chunk.push(ls.shift())}np().push({i:-1,ls:chunk,tx:M,ty:top+chunk[0].sz})}});
    pg=null}}}
 return pages}
// arma el PDF a mano: objetos, imágenes y tabla de referencias
function buildPdf(P,fmt){

 const parts=[],off=[];let pos=0;const put=u=>{parts.push(u);pos+=u.length};
 const objS=(id,s)=>{off[id]=pos;put(enc(`${id} 0 obj\n${s}\nendobj\n`))};
 const m=P.length,pb=5+m;
 put(enc('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n'));
 objS(1,'<< /Type /Catalog /Pages 2 0 R >>');
 objS(2,`<< /Type /Pages /Kids [${Array.from({length:npg},(_,p)=>(pb+2*p+1)+' 0 R').join(' ')}] /Count ${npg} >>`);
 objS(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 objS(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 P.forEach((p,i)=>{off[5+i]=pos;put(enc(`${5+i} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.pw} /Height ${p.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`));put(p.jpg);put(enc('\nendstream\nendobj\n'))});
 for(let pg=0;pg<npg;pg++){
  const sl=pages[pg]||[];
  const T=(f,sz,x,yt,s)=>`BT /F${f} ${sz} Tf ${x.toFixed(2)} ${(PH-yt).toFixed(2)} Td (${pesc(s)}) Tj ET\n`;
  let c='0 g\n'+T(2,11,M,M+8,S.proj||'Planta de cámara')+T(1,9,PW-M-80,M+8,'Página '+(pg+1)+' / '+npg);
  c+=`0.8 w 0 G ${M} ${PH-(M+16)} m ${PW-M} ${PH-(M+16)} l S\n`;
  sl.forEach(o=>{
   if(o.i>=0){const yb=(PH-o.y-o.ih).toFixed(2);
    c+=`q ${o.iw.toFixed(2)} 0 0 ${o.ih.toFixed(2)} ${o.x.toFixed(2)} ${yb} cm /Im${o.i} Do Q\n`;
    c+=`0.5 w 0.3 G ${o.x.toFixed(2)} ${yb} ${o.iw.toFixed(2)} ${o.ih.toFixed(2)} re S\n0 g\n`}
   let ty=o.ty;o.ls.forEach(l=>{c+=T(l.f,l.sz,o.tx,ty,l.t);ty+=l.lh})});
  const cid=pb+2*pg,cu=enc(c);
  off[cid]=pos;put(enc(`${cid} 0 obj\n<< /Length ${cu.length} >>\nstream\n`));put(cu);put(enc('\nendstream\nendobj\n'));
  objS(cid+1,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Contents ${cid} 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${sl.filter(o=>o.i>=0).map(o=>`/Im${o.i} ${5+o.i} 0 R`).join(' ')} >> >> >>`)}
 const n=pb+2*npg,xr=pos;let x='xref\n0 '+n+'\n0000000000 65535 f \n';
 for(let i=1;i<n;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 put(enc(x+`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`));

document.addEventListener('keydown',e=>{
 if(!(e.ctrlKey||e.metaKey)||e.altKey)return;
 if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 const kk=e.key.toLowerCase();
 if((kk==='z'&&!e.shiftKey)||kk==='d'){e.preventDefault();goHist(-1)}
 else if((kk==='z'&&e.shiftKey)||kk==='y'){e.preventDefault();goHist(1)}
 else if((root.contains(e.target)||e.target===document.body)&&e.target.tagName!=='SELECT'){
  if(kk==='c'&&selAll().length){e.preventDefault();copySel()}
  else if(kk==='v'&&clip.length){e.preventDefault();paste()}
  else if(kk==='a'){e.preventDefault();setSel(items().slice());panel();list();draw()}}});
